openapi: "3.0.3"

info:
  title: EthioScript — Account Service
  version: "1.0.0"
  description: |
    Full account management microservice.

    **Base URL:** `http://localhost:8000`

    **No `/api/v1` prefix** — routes are clean and flat.

    ## Authentication
    - Public endpoints: `POST /auth/register`, `POST /auth/login`, `POST /auth/refresh`, `POST /auth/forgot-password`, `POST /auth/reset-password`, `POST /auth/verify-email`
    - Protected endpoints require: `Authorization: Bearer <access_token>`

servers:
  - url: http://localhost:8000
    description: Local development (host port 8000 → container port 6000; Chrome blocks 6000)
  - url: https://accounts.ethioscript.io
    description: Production

tags:
  - name: auth
    description: Registration, login, tokens, password, email verification
  - name: users
    description: User management within a tenant (Tenant Admin+)
  - name: tenants
    description: Tenant management (Platform Operator only)
  - name: api-keys
    description: API key creation and revocation
  - name: system
    description: Health and readiness probes

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from POST /auth/login

  schemas:

    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:    { type: string }
        code:     { type: string }
        trace_id: { type: string, format: uuid }

    MessageResponse:
      type: object
      properties:
        message: { type: string }

    UserRole:
      type: string
      enum: [TENANT_ADMIN, CONTRIBUTOR, REVIEWER, READ_ONLY_AUDITOR, PLATFORM_OPERATOR]

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, PENDING_VERIFICATION, DELETED]

    Tenant:
      type: object
      properties:
        id:                 { type: string, format: uuid }
        name:               { type: string, example: "Addis University" }
        slug:               { type: string, example: "addis-uni" }
        max_upload_size_mb: { type: integer, example: 50 }
        max_storage_gb:     { type: integer, example: 10 }
        retention_days:     { type: integer, example: 365 }
        is_active:          { type: boolean }
        created_at:         { type: string, format: date-time }
        updated_at:         { type: string, format: date-time }

    User:
      type: object
      properties:
        id:             { type: string, format: uuid }
        tenant_id:      { type: string, format: uuid }
        email:          { type: string, format: email }
        name:           { type: string }
        role:           { $ref: '#/components/schemas/UserRole' }
        status:         { $ref: '#/components/schemas/UserStatus' }
        email_verified: { type: boolean }
        last_login_at:  { type: string, format: date-time, nullable: true }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }

    TokenResponse:
      type: object
      required: [access_token, refresh_token, expires_at, token_type, user]
      properties:
        access_token:
          type: string
          description: Short-lived JWT (default 24 h)
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: Opaque 64-char hex token for rotation (default 7 days)
        expires_at:
          type: string
          format: date-time
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        tenant_slug:
          type: string
          example: default
          description: Slug of the tenant to register under. Defaults to "default" if omitted.
        name:
          type: string
          example: Abebe Kebede
        email:
          type: string
          format: email
          example: abebe@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: Must contain uppercase, lowercase, and a digit

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    UpdateProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Abebe Kebede }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password:     { type: string, format: password, minLength: 8 }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:        { type: string }
        new_password: { type: string, format: password, minLength: 8 }

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    CreateTenantRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, example: "Addis University" }
        slug: { type: string, example: "addis-uni" }

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/UserRole' }

    ListUsersResponse:
      type: object
      properties:
        users:     { type: array, items: { $ref: '#/components/schemas/User' } }
        total:     { type: integer }
        page:      { type: integer }
        page_size: { type: integer }

    APIKey:
      type: object
      properties:
        id:           { type: string, format: uuid }
        tenant_id:    { type: string, format: uuid }
        user_id:      { type: string, format: uuid }
        name:         { type: string }
        key_prefix:   { type: string, description: "First 8 chars of the raw key (safe to display)" }
        scopes:       { type: array, items: { type: string } }
        expires_at:   { type: string, format: date-time, nullable: true }
        revoked:      { type: boolean }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at:   { type: string, format: date-time }

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:       { type: string, example: "CI/CD pipeline key" }
        scopes:     { type: array, items: { type: string }, example: ["documents:read", "documents:write"] }
        expires_at: { type: string, format: date-time, nullable: true }

    CreateAPIKeyResponse:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/APIKey'
        raw_key:
          type: string
          description: "Full API key — shown ONCE. Store securely. Format: es_<64-hex-chars>"
          example: "es_a1b2c3d4e5f6..."

    HealthResponse:
      type: object
      properties:
        status:    { type: string, enum: [ok, degraded] }
        version:   { type: string, example: "3.1.0" }
        timestamp: { type: string, format: date-time }
        services:
          type: object
          additionalProperties: { type: string }

paths:

  # ── System ──────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [system]
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        "503":
          description: Degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      operationId: readiness
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }

  # ── Auth — public ────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              name: Abebe Kebede
              email: abebe@example.com
              password: Secret123
      responses:
        "201":
          description: Registered — token pair issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        "409": { description: Email already registered, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /auth/login:
    post:
      tags: [auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "401": { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        "403": { description: Account suspended, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      description: Exchanges a valid refresh token for a **new rotated** access + refresh token pair.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "401": { description: Token expired or revoked, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout (current device)
      description: Revokes the provided refresh token.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "204": { description: Logged out }

  /auth/logout-all:
    post:
      tags: [auth]
      summary: Logout all devices
      description: Revokes every refresh token for the authenticated user.
      operationId: logoutAll
      security:
        - BearerAuth: []
      responses:
        "204": { description: All sessions revoked }
        "401": { description: Unauthenticated, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /auth/me:
    get:
      tags: [auth]
      summary: Get current user profile
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "401": { description: Unauthenticated, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    put:
      tags: [auth]
      summary: Update profile
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /auth/change-password:
    post:
      tags: [auth]
      summary: Change password
      description: Changes password and revokes all sessions on all devices.
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        "204": { description: Password changed }
        "400": { description: Password policy violation, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        "401": { description: Wrong current password, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request password reset
      description: |
        Sends a password-reset link to the email address.
        Always returns 204 — even if the email does not exist — to prevent account enumeration.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        "204": { description: Reset email sent (if account exists) }

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Reset password with token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        "204": { description: Password reset }
        "400": { description: Token invalid or expired, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /auth/send-verification:
    post:
      tags: [auth]
      summary: Resend verification email
      operationId: sendVerification
      security:
        - BearerAuth: []
      responses:
        "204": { description: Verification email sent }

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verify email address
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        "204": { description: Email verified }
        "400": { description: Token invalid or expired, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  # ── API Keys ─────────────────────────────────────────────────────────────────

  /api-keys:
    post:
      tags: [api-keys]
      summary: Create API key
      description: |
        Creates a new API key. The `raw_key` is returned **once only** — store it securely.
        Format: `es_<64-hex-chars>`
      operationId: createAPIKey
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAPIKeyRequest' }
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAPIKeyResponse' }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    get:
      tags: [api-keys]
      summary: List API keys
      description: Returns all active (non-revoked) API keys for the authenticated user. Raw key is never returned.
      operationId: listAPIKeys
      security:
        - BearerAuth: []
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/APIKey' }

  /api-keys/{id}:
    delete:
      tags: [api-keys]
      summary: Revoke API key
      operationId: revokeAPIKey
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Key revoked }
        "404": { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  # ── Users ────────────────────────────────────────────────────────────────────

  /users:
    get:
      tags: [users]
      summary: List users in tenant
      description: Paginated user list scoped to the authenticated user's tenant. Requires TENANT_ADMIN or PLATFORM_OPERATOR.
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - { name: page,      in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListUsersResponse' }
        "403": { description: Insufficient role, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /users/{id}:
    get:
      tags: [users]
      summary: Get user by ID
      operationId: getUser
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "404": { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    delete:
      tags: [users]
      summary: Delete user
      description: Soft-deletes user and revokes all their sessions.
      operationId: deleteUser
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /users/{id}/role:
    put:
      tags: [users]
      summary: Update user role
      operationId: updateUserRole
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRoleRequest' }
      responses:
        "204": { description: Role updated }
        "400": { description: Invalid role, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /users/{id}/suspend:
    post:
      tags: [users]
      summary: Suspend user
      description: Suspends account and revokes all sessions.
      operationId: suspendUser
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Suspended }

  /users/{id}/activate:
    post:
      tags: [users]
      summary: Activate user
      description: Re-activates a suspended user account.
      operationId: activateUser
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Activated }

  # ── Tenants ──────────────────────────────────────────────────────────────────

  /tenants:
    post:
      tags: [tenants]
      summary: Create tenant
      description: Platform Operator only.
      operationId: createTenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantRequest' }
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        "409": { description: Slug already exists, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    get:
      tags: [tenants]
      summary: List tenants
      description: Platform Operator only.
      operationId: listTenants
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Tenant list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenant' }

  /tenants/{id}:
    get:
      tags: [tenants]
      summary: Get tenant
      operationId: getTenant
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        "404": { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
