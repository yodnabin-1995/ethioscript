# ═══════════════════════════════════════════════════════════════════════════════
#  EthioScript & Voice AI — Microservices Docker Compose
#  Port map:
#    6000  → api-gateway          (public entry point)
#    6001  → document-service     (internal)
#    6002  → job-orchestrator     (internal)
#    6003  → ocr-worker metrics   (internal, Prometheus scrape)
#    6004  → stt-worker metrics   (internal, Prometheus scrape)
#    6005  → swagger-ui           (API docs)
#    6100  → pgadmin              (DB admin UI)
#    6200  → prometheus           (metrics)
#    6201  → grafana              (dashboards)
#    6300  → postgres             (exposed for local dev tools)
#    6301  → redis                (exposed for local dev tools)
#    6302  → minio API            (object storage API)
#    6303  → minio console        (object storage UI)
#    6304  → rabbitmq AMQP        (message broker)
#    6305  → rabbitmq management  (broker UI)
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  ethioscript-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

services:

  # ───────────────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ───────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: ethioscript-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ethio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ethiopass}
      POSTGRES_DB: ${POSTGRES_DB:-ethioscript}
    ports:
      - "6300:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ethio} -d ${POSTGRES_DB:-ethioscript}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ethioscript-net

  redis:
    image: redis:7-alpine
    container_name: ethioscript-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --appendonly yes --loglevel notice
    ports:
      - "6301:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ethioscript-net

  minio:
    build:
      context: ./deployments/minio
      dockerfile: Dockerfile
    image: ethioscript-minio:latest
    container_name: ethioscript-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-MinioPass2026!}
      MINIO_SERVER_URL: ${MINIO_PUBLIC_URL:-http://localhost:6302}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:6303
    ports:
      - "6302:9000"
      - "6303:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - ethioscript-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ethioscript-rabbitmq
    restart: unless-stopped
    hostname: ethioscript-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ethio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ethiopass}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-ethioscript}
    ports:
      - "6304:5672"
      - "6305:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - ethioscript-net

  # ───────────────────────────────────────────────────────────────────────────
  # ADMIN / OBSERVABILITY TOOLS
  # ───────────────────────────────────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ethioscript-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ethioscript.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadminpass}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "6100:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ethioscript-net

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: ethioscript-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "6200:9090"
    volumes:
      - ./deployments/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ethioscript-net

  grafana:
    image: grafana/grafana:10.1.0
    container_name: ethioscript-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-grafanapass}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "6201:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/compose/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    networks:
      - ethioscript-net

  # ───────────────────────────────────────────────────────────────────────────
  # MICROSERVICES
  # ───────────────────────────────────────────────────────────────────────────

  account-service:
    build:
      context: ./services/account-service
      dockerfile: Dockerfile
      target: production
    container_name: ethioscript-account-service
    restart: unless-stopped
    ports:
      - "8000:6000"
    volumes:
      - ./services/account-service/cmd/server/docs/openapi.yml:/app/docs/openapi.yml:ro
    environment:
      PORT: "6000"
      ENV: ${ENV:-development}
      # Auth / JWT
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_change_in_production_32chars}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS:-7}
      EMAIL_VERIFY_EXPIRY_HOURS: ${EMAIL_VERIFY_EXPIRY_HOURS:-24}
      PASSWORD_RESET_EXPIRY_MINUTES: ${PASSWORD_RESET_EXPIRY_MINUTES:-30}
      # Database
      POSTGRES_DSN: postgres://${POSTGRES_USER:-ethio}:${POSTGRES_PASSWORD:-ethiopass}@postgres:5432/${POSTGRES_DB:-ethioscript}?sslmode=disable
      # Cache
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
      REDIS_DB: "0"
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      # Rate limiting
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-100}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      # Security
      MAX_LOGIN_ATTEMPTS: "5"
      LOCKOUT_MINUTES: "15"
      BCRYPT_COST: "12"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-key}
      # MinIO (profile photo storage)
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: localhost:6302
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-MinioPass2026!}
      MINIO_BUCKET: ${MINIO_BUCKET:-ethioscript-assets}
      MINIO_USE_SSL: "false"
      # Swagger
      SWAGGER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ethioscript-net

  document-service:
    build:
      context: ./services/document-service
      dockerfile: Dockerfile
      target: production
    container_name: ethioscript-document-service
    restart: unless-stopped
    ports:
      - "6001:6001"
    volumes:
      - ./services/document-service/cmd/server/docs/openapi.yml:/app/docs/openapi.yml:ro
    environment:
      PORT: "6001"
      ENV: ${ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000,http://127.0.0.1:3000}
      # Database
      POSTGRES_DSN: postgres://${POSTGRES_USER:-ethio}:${POSTGRES_PASSWORD:-ethiopass}@postgres:5432/${POSTGRES_DB:-ethioscript}?sslmode=disable
      # Broker
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ethio}:${RABBITMQ_PASSWORD:-ethiopass}@rabbitmq:5672/${RABBITMQ_VHOST:-ethioscript}
      RABBITMQ_EXCHANGE: ethioscript.events
      RABBITMQ_QUEUE_DOCUMENT: ethioscript.document.created
      # Storage
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:6302}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-ethioscript-assets}
      MINIO_USE_SSL: "false"
      # Internal auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ethioscript-net

  job-orchestrator:
    build:
      context: ./services/job-orchestrator
      dockerfile: Dockerfile
      target: production
    container_name: ethioscript-job-orchestrator
    restart: unless-stopped
    ports:
      - "6002:6002"
    volumes:
      - ./services/job-orchestrator/cmd/server/docs/openapi.yml:/app/docs/openapi.yml:ro
    environment:
      PORT: "6002"
      ENV: ${ENV:-development}
      # Database
      POSTGRES_DSN: postgres://${POSTGRES_USER:-ethio}:${POSTGRES_PASSWORD:-ethiopass}@postgres:5432/${POSTGRES_DB:-ethioscript}?sslmode=disable
      # Broker
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ethio}:${RABBITMQ_PASSWORD:-ethiopass}@rabbitmq:5672/${RABBITMQ_VHOST:-ethioscript}
      RABBITMQ_EXCHANGE: ethioscript.events
      RABBITMQ_QUEUE_OCR: ethioscript.jobs.ocr
      RABBITMQ_QUEUE_STT: ethioscript.jobs.stt
      RABBITMQ_QUEUE_DEAD_LETTER: ethioscript.jobs.dead-letter
      # Cache
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
      REDIS_DB: "1"
      # Internal auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-key}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000,http://127.0.0.1:3000}
      # Job policy
      MAX_RETRY_ATTEMPTS: "3"
      RETRY_BACKOFF_BASE_SECONDS: "30"
      OUTBOX_POLL_INTERVAL_SECONDS: "5"
      JOB_HEARTBEAT_SECONDS: "30"
      JOB_TIMEOUT_SECONDS: "300"
      LEASE_DURATION_SECONDS: "60"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ethioscript-net

  ai-chat:
    build:
      context: ./services/ai-chat
      dockerfile: Dockerfile
    container_name: ethioscript-ai-chat
    restart: unless-stopped
    ports:
      - "6006:6006"
    environment:
      AI_SERVICE_SECRET:    ${AI_SERVICE_SECRET:-change_me_ai_secret}
      LLM_PROVIDER:         ${LLM_PROVIDER:-mock}
      LLM_MODEL:            ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_API_KEY:          ${LLM_API_KEY:-}
      LLM_BASE_URL:         ${LLM_BASE_URL:-}
      WHISPER_MODEL:        ${WHISPER_MODEL:-whisper-large-v3-turbo}
      TTS_PROVIDER:         ${TTS_PROVIDER:-gtts}
      TTS_VOICE:            ${TTS_VOICE:-alloy}
      MAX_AUDIO_MB:         ${MAX_AUDIO_MB:-25}
      DOCUMENT_SERVICE_URL: http://document-service:6001
      INTERNAL_API_KEY:     ${INTERNAL_API_KEY:-EthioInternalKey2026!}
      REDIS_URL:            redis://:${REDIS_PASSWORD:-redispass}@redis:6379/2
      MAX_CONTEXT_MESSAGES: ${MAX_CONTEXT_MESSAGES:-20}
      CHAT_RATE_LIMIT_RPM:  ${CHAT_RATE_LIMIT_RPM:-30}
      ALLOWED_ORIGINS:      ${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6006/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - ethioscript-net

  ocr-worker:
    build:
      context: ./services/ocr-worker
      dockerfile: Dockerfile
    container_name: ethioscript-ocr-worker
    restart: unless-stopped
    ports:
      - "6003:6003"
    environment:
      ENV: ${ENV:-development}
      METRICS_PORT: "6003"
      # Broker
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ethio}:${RABBITMQ_PASSWORD:-ethiopass}@rabbitmq:5672/${RABBITMQ_VHOST:-ethioscript}
      RABBITMQ_QUEUE_OCR: ethioscript.jobs.ocr
      RABBITMQ_QUEUE_RESULTS: ethioscript.jobs.results
      RABBITMQ_PREFETCH: "2"
      # Storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-ethioscript-assets}
      MINIO_USE_SSL: "false"
      # Orchestrator callback
      JOB_ORCHESTRATOR_URL: http://job-orchestrator:6002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-key}
      # OCR settings
      OCR_WORKER_CONCURRENCY: "2"
      OCR_DPI: "300"
      OCR_LANGUAGE: ${OCR_LANGUAGE:-amh+eng}
      OCR_PSM: "3"
      OCR_OEM: "3"
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      # Image pre-processing
      OCR_DESKEW: "true"
      OCR_DENOISE: "true"
      OCR_UPSCALE_THRESHOLD_DPI: "150"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      job-orchestrator:
        condition: service_healthy
    networks:
      - ethioscript-net

  stt-worker:
    build:
      context: ./services/stt-worker
      dockerfile: Dockerfile
    container_name: ethioscript-stt-worker
    restart: unless-stopped
    ports:
      - "6004:6004"
    environment:
      ENV: ${ENV:-development}
      METRICS_PORT: "6004"
      # Broker
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ethio}:${RABBITMQ_PASSWORD:-ethiopass}@rabbitmq:5672/${RABBITMQ_VHOST:-ethioscript}
      RABBITMQ_QUEUE_STT: ethioscript.jobs.stt
      RABBITMQ_QUEUE_RESULTS: ethioscript.jobs.results
      RABBITMQ_PREFETCH: "1"
      # Storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-ethioscript-assets}
      MINIO_USE_SSL: "false"
      # Orchestrator callback
      JOB_ORCHESTRATOR_URL: http://job-orchestrator:6002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-key}
      # STT settings
      STT_MODEL: ${STT_MODEL:-whisper-small}
      STT_LANGUAGE: ${STT_LANGUAGE:-am}
      STT_CHUNK_SECONDS: "30"
      STT_WORKER_CONCURRENCY: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      job-orchestrator:
        condition: service_healthy
    networks:
      - ethioscript-net

  # ───────────────────────────────────────────────────────────────────────────
  # ONE-TIME INIT JOBS
  # ───────────────────────────────────────────────────────────────────────────

  minio-init:
    build:
      context: ./deployments/minio
      dockerfile: Dockerfile
    image: ethioscript-minio:latest
    container_name: ethioscript-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-MinioPass2026!} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-ethioscript-assets} &&
        mc anonymous set download local/${MINIO_BUCKET:-ethioscript-assets} &&
        mc mb --ignore-existing local/ethioscript-artifacts &&
        mc anonymous set download local/ethioscript-artifacts &&
        echo 'MinIO buckets ready'
      "
    networks:
      - ethioscript-net


