[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default markers
markers =
    requires_tesseract: marks tests that need Tesseract installed
    slow: marks tests that take more than 30 seconds
    smoke: fast sanity checks only

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_date_format = %H:%M:%S

# HTML report output
addopts =
    -v
    --tb=short
    --html=reports/pytest_report.html
    --self-contained-html
    --json-report
    --json-report-file=reports/pytest_report.json
