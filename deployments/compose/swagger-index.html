<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EthioScript & Voice AI — API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; }

    #header {
      background: linear-gradient(135deg, #1a3a5c 0%, #2c5282 100%);
      color: white;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #header h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.3px; }
    #header .version { opacity: 0.7; font-size: 0.85rem; }

    #service-tabs {
      background: #2d3748;
      display: flex;
      gap: 2px;
      padding: 10px 32px;
      border-bottom: 3px solid #1a3a5c;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.7);
      padding: 9px 18px;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn:hover { background: rgba(255,255,255,0.1); color: white; }
    .tab-btn.active { background: white; color: #1a3a5c; font-weight: 700; }

    .badge {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
    }
    .badge-public   { background: #48bb78; color: white; }
    .badge-internal { background: #9f7aea; color: white; }

    #swagger-ui { background: white; min-height: calc(100vh - 120px); }
    #swagger-ui .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>

<div id="header">
  <h1>🇪🇹 EthioScript &amp; Voice AI — API Documentation</h1>
  <span class="version">v3.1.0 | Microservices</span>
</div>

<div id="service-tabs">
  <button class="tab-btn active" onclick="loadSpec('account')" id="btn-account">
    Account Service
    <span class="badge badge-public">:6000</span>
  </button>
  <button class="tab-btn" onclick="loadSpec('document')" id="btn-document">
    Document Service
    <span class="badge badge-internal">:6001</span>
  </button>
  <button class="tab-btn" onclick="loadSpec('job')" id="btn-job">
    Job Orchestrator
    <span class="badge badge-internal">:6002</span>
  </button>
</div>

<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
<script>
  const specs = {
    'account':  '/specs/openapi-account-service.yml',
    'document': '/specs/openapi-document-service.yml',
    'job':      '/specs/openapi-job-orchestrator.yml',
  };

  // Service base URLs for "Try it out"
  const tryItUrls = {
    'account':  'http://localhost:6000',
    'document': 'http://localhost:6001',
    'job':      'http://localhost:6002',
  };

  let ui;

  function loadSpec(service) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + service).classList.add('active');

    document.getElementById('swagger-ui').innerHTML = '';

    ui = SwaggerUIBundle({
      url: specs[service],
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: 'StandaloneLayout',
      deepLinking: true,
      displayRequestDuration: true,
      filter: true,
      tryItOutEnabled: service === 'account',
      persistAuthorization: true,
      requestInterceptor: (req) => {
        const token = window._authToken;
        if (token && req.headers) {
          req.headers['Authorization'] = 'Bearer ' + token;
        }
        return req;
      },
      onComplete: () => {
        // Capture and persist token across tab switches
        const origAuth = ui.authActions && ui.authActions.authorize;
        if (origAuth) {
          ui.authActions.authorize = (payload) => {
            if (payload && payload.BearerAuth) {
              window._authToken = payload.BearerAuth.value;
            }
            return origAuth(payload);
          };
        }
      },
    });
  }

  loadSpec('account');
</script>
</body>
</html>
