global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "ethioscript"

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:6000"]
    metrics_path: /metrics

  - job_name: "document-service"
    static_configs:
      - targets: ["document-service:6001"]
    metrics_path: /metrics

  - job_name: "job-orchestrator"
    static_configs:
      - targets: ["job-orchestrator:6002"]
    metrics_path: /metrics

  - job_name: "ocr-worker"
    static_configs:
      - targets: ["ocr-worker:6003"]
    metrics_path: /metrics

  - job_name: "stt-worker"
    static_configs:
      - targets: ["stt-worker:6004"]
    metrics_path: /metrics

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
    metrics_path: /metrics
